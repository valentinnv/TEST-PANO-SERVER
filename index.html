<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>360° Panorama Auto-Discovery Gallery</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
    
    #canvas-container { width: 100%; height: 100%; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }

    /* Left Edge Hover / Touch Trigger Zone */
    .edge-trigger {
      position: absolute;
      top: 0;
      left: 0;
      width: 35px; /* Slightly wider for easier touch targeting */
      height: 100%;
      z-index: 12;
      background: transparent;
    }

    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      max-width: 80vw; /* Adapts cleanly to narrow phone screens */
      height: 100%;
      z-index: 10;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }

    .sidebar.collapsed { transform: translateX(-100%); }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 600; }

    .gallery-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .thumb-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .thumb-card:hover, .thumb-card:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .thumb-card.active {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.2);
    }

    .thumb-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
    }

    .thumb-card .title {
      padding: 8px 10px;
      color: #ddd;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      color: #888;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 40px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="edge-trigger" id="edge-trigger"></div>

  <div class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <h2>360° Panoramas</h2>
    </div>
    <div class="gallery-list" id="gallery">
      <div class="empty-state">Scanning assets folder...</div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls, sphereMesh;
    const DEFAULT_FOV = 75, MIN_FOV = 30, MAX_FOV = 100;
    let targetFov = DEFAULT_FOV;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(DEFAULT_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.001);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.rotateSpeed = -0.4;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      const geometry = new THREE.SphereGeometry(500, 128, 64);
      geometry.scale(-1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
      sphereMesh = new THREE.Mesh(geometry, material);
      scene.add(sphereMesh);

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('wheel', onMouseWheel, { passive: false });
      window.addEventListener('dblclick', onDoubleClick);

      setupInteractions();
      autoDiscoverAssets();
      animate();
    }

    function setupInteractions() {
      const sidebar = document.getElementById('sidebar');
      const trigger = document.getElementById('edge-trigger');

      // 1. Desktop Hover Setup
      trigger.addEventListener('mouseenter', openSidebar);
      sidebar.addEventListener('mouseleave', closeSidebar);

      // 2. Mobile Touch Swipe Setup
      let touchStartX = 0;
      let touchStartY = 0;

      window.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;

        // Ensure horizontal swipe is larger than vertical movement
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
          // Swipe Right from near left edge -> Open Sidebar
          if (deltaX > 0 && touchStartX < 50) {
            openSidebar();
          }
          // Swipe Left anywhere -> Close Sidebar
          else if (deltaX < 0) {
            closeSidebar();
          }
        }
      }, { passive: true });
    }

    async function autoDiscoverAssets() {
      const gallery = document.getElementById('gallery');
      try {
        const response = await fetch('/api/discover-assets');
        const filenames = await response.json();

        if (!filenames || filenames.length === 0) {
          gallery.innerHTML = '<div class="empty-state">No images found in <b>assets/</b> folder. Add images and refresh.</div>';
          return;
        }

        gallery.innerHTML = '';
        filenames.forEach((filename, index) => {
          const imgPath = `./assets/${filename}`;
          const card = document.createElement('div');
          card.className = 'thumb-card';
          if (index === 0) card.classList.add('active');

          card.innerHTML = `
            <img src="${imgPath}" alt="${filename}" />
            <div class="title">${filename}</div>
          `;

          card.onclick = () => {
            document.querySelectorAll('.thumb-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            loadPanorama(imgPath);
            closeSidebar();
          };

          gallery.appendChild(card);
        });

        loadPanorama(`./assets/${filenames[0]}`);

      } catch (err) {
        gallery.innerHTML = '<div class="empty-state" style="color:#ef4444;">Error connecting to auto-discovery server.</div>';
      }
    }

    function loadPanorama(imageSrc) {
      const loader = new THREE.TextureLoader();
      loader.load(imageSrc, (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
        if (maxAnisotropy > 0) texture.anisotropy = maxAnisotropy;

        sphereMesh.material.map = texture;
        sphereMesh.material.color.setHex(0xffffff);
        sphereMesh.material.needsUpdate = true;
      });
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.remove('collapsed');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.add('collapsed');
    }

    function onMouseWheel(event) {
      event.preventDefault();
      targetFov += event.deltaY * 0.05;
      targetFov = Math.max(MIN_FOV, Math.min(MAX_FOV, targetFov));
    }

    function onDoubleClick() {
      targetFov = (Math.abs(camera.fov - DEFAULT_FOV) > 5) ? DEFAULT_FOV : (MIN_FOV + 10);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (Math.abs(camera.fov - targetFov) > 0.01) {
        camera.fov += (targetFov - camera.fov) * 0.1;
        camera.updateProjectionMatrix();
      }
      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
